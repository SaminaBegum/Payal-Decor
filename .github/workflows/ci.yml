name: CI & Quality Pipeline

on:
  push:
    branches:
      - payal-decor-development
      - main
      - features
      - crm
      - "feat/**"
  pull_request:
    branches:
      - payal-decor-development
      - main

jobs:
  backend-ci:
    name: Backend CI (Node & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: payal_decor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Linter
        run: npm run lint

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/payal_decor_test
          JWT_SECRET: ci-pipeline-secret-key-for-test-12345
          PORT: 5000
        run: npm test

  frontend-ci:
    name: Frontend CI (React, TypeScript & Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./modulaflow-erp-main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: modulaflow-erp-main/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Production Build
        run: npm run build
