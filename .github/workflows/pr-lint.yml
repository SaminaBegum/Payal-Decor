name: Lint PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-title:
    name: Validate Conventional Commit Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Standard Conventional Commit types
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Allow both scoped (feat(purchase): ...) and unscoped (feat: ...)
          requireScope: false
          # Ensure subject starts with lowercase
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject in the PR title must not start with an uppercase character.
            Example: 'feat(purchase): add purchase orders' instead of 'feat(purchase): Add purchase orders'
          # Ignore title check if PR is marked as WIP
          wip: true
          # For repos squash-merging into development/main, check the PR title
          validateSingleCommit: false
